```html
<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Analyzer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 350px;
            margin: auto;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🔐 Password Analyzer</h2>

    <p>Enter Your Password</p>

    <input type="password" id="password"
           placeholder="Enter password">

    <br>

    <button onclick="checkPassword()">Check Strength</button>

    <p id="result"></p>

</div>

<script>
function checkPassword() {

    let password = document.getElementById("password").value;
    let result = document.getElementById("result");

    let upper = /[A-Z]/.test(password);
    let lower = /[a-z]/.test(password);
    let number = /[0-9]/.test(password);
    let special = /[^A-Za-z0-9]/.test(password);

    if (password.length == 0) {
        result.innerHTML = "Please enter a password";
        result.style.color = "orange";
    }

    else if (password.length < 8) {
        result.innerHTML = "Weak Password ❌";
        result.style.color = "red";
    }

    else if (upper && lower && number && special) {
        result.innerHTML = "Strong Password ✅";
        result.style.color = "green";
    }

    else {
        result.innerHTML = "Medium Password ⚠️";
        result.style.color = "orange";
    }
}
</script>

</body>
</html>
```
